<style>
/* Layout: one narrow phone column — sticky brand bar + filter row, today's top strip, then a scannable deal list; tap opens a bottom sheet. */
:root{
  --ink:#0E0E0E;       /* brand black */
  --panel:#1A1A18;     /* raised black */
  --line:#2C2B26;      /* hairlines on black */
  --yellow:#FFD400;    /* brand yellow */
  --paper:#F4F2EA;     /* text on black */
  --muted:#9C998C;     /* secondary text, warm grey */
  --good:#3DDC84;      /* cheapest */
  --bad:#FF6B5A;       /* crossed-out / warnings */
  --f-display:"Montserrat",system-ui,sans-serif;
  --f-body:"Montserrat",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-weight:500;font-size:14px;line-height:1.4}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:-.5px}
.logo b{color:var(--yellow);font-weight:900}
.asof{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:right}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px}
.sel{position:relative}
.sel select{appearance:none;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 26px 9px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.sel::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select.on{border-color:var(--yellow);color:var(--yellow)}
.row2{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:6px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.search::placeholder{color:var(--muted)}
.reset{background:none;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.reset:hover{color:var(--paper)}

.stats{display:flex;gap:18px;margin-top:18px;font-size:12px;color:var(--muted)}
.stats strong{display:block;font-family:var(--f-num);font-size:18px;color:var(--paper);font-weight:700}

h2{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px}
.hot{flex:0 0 190px;scroll-snap-align:start;background:var(--yellow);color:var(--ink);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:0;text-align:left}
.hot .pct{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;letter-spacing:-1px}
.hot .nm{font-weight:800;font-size:13.5px;line-height:1.25;min-height:34px}
.hot .pr{font-family:var(--f-num);font-weight:700;font-size:15px}
.hot .st{font-size:11.5px;font-weight:700;opacity:.7}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.mono{width:44px;height:44px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;color:var(--yellow)}
.mid{min-width:0}
.mid .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .others{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.right .pr{font-family:var(--f-num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.right .st{font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-family:var(--f-num);font-weight:700;font-size:11px;background:var(--yellow);color:var(--ink);border-radius:6px;padding:1px 6px;margin-top:3px}
.badge.zero{background:var(--panel);color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.more{margin:16px auto 0;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:20px 20px 0 0;max-width:460px;margin:0 auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.sheet .kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.big{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.big .pr{font-family:var(--f-num);font-size:28px;font-weight:700;color:var(--yellow)}
.big .st{font-weight:700}
.save{color:var(--good);font-weight:700;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-variant-numeric:tabular-nums}
td{padding:11px 0;border-top:1px solid var(--line)}
td.p{text-align:right;font-family:var(--f-num);font-weight:700}
td.p a{color:var(--yellow);text-decoration:none;border-bottom:1px dashed currentColor}
tr.best td{color:var(--good)}
tr.best td.p a{color:var(--good)}
.mono img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:12px}
.hero{display:block;max-width:100%;height:160px;object-fit:contain;margin:0 auto 12px;background:#fff;border-radius:14px;width:100%}
.sel-n{display:block;font-size:11px;color:var(--muted)}
.old{text-decoration:line-through;color:var(--bad);font-size:11px;margin-left:6px;font-family:var(--f-num)}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
.cta{display:block;width:100%;margin-top:16px;background:var(--yellow);color:var(--ink);border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.cta.ghost{background:none;color:var(--paper);border:1px solid var(--line);margin-top:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:30;max-width:90%}
.foot{margin-top:28px;font-size:11.5px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>

-7f4f7cede1f192945bdbfab024134e2c.webp?_=ozauc","deal":false,"gap":0,"save":0,"score":0,"offers":[{"s":"Glotr","p":15351388,"u":"https://glotr.uz/uz/planshet-samsung-galaxy-tab-s8-ultra-5g-8128-gb-p-831100/","o":null,"sel":"\"MZSHOP\" MCHJ"}]},{"sku":"Сapple iPhone 13 Pro 128GB","brand":"Сapple","img":"https://files.glotr.uz/company/000/005/799/products/2023/09/30/2023-09-30-16-17-15-411818-6b10bed5c6eabff7427e2ccc5dc2ff41.webp?_=ozauc","deal":false,"gap":0,"save":0,"score":0,"offers":[{"s":"Glotr","p":12360000,"u":"https://glotr.uz/uz/smartfon-apple-iphone-13-pro-128gb-alpiyskiy-zeleniy-p-890042/","o":null,"sel":"ELSO.uz"}]},{"sku":"Сма Apple iPhone 13 Pro Max 128GB","brand":"Сма","img":"https://files.glotr.uz/company/000/005/799/products/2023/09/30/2023-09-30-15-53-41-838093-dea2bc3116933b9fb813f07648347a0e.webp?_=ozauc","deal":false,"gap":0,"save":0,"score":0,"offers":[{"s":"Glotr","p":12720000,"u":"https://glotr.uz/uz/smartfon-apple-iphone-13-pro-max-128gb-grafitoviy-p-890014/","o":null,"sel":"ELSO.uz"}]}]};
const $ = s => document.querySelector(s);
const som = n => n.toLocaleString('ru-RU').replace(/ /g,' ') + " so'm";
const mln = n => (n/1e6).toFixed(n>=1e7?1:2).replace('.',',') + ' mln';
const d = DATA.date; const dateTxt = `${d.slice(8,10)}.${d.slice(5,7)}.${d.slice(0,4)}`;
$('#asof').textContent = dateTxt + ' holatiga';
$('#foot-date').textContent = dateTxt;

const items = DATA.items;
const deals = items.filter(x => x.deal);
$('#foot-stores').textContent = DATA.stores.join(', ');
for (const s of DATA.stores){ const o=document.createElement('option'); o.value=s; o.textContent=s; $('#f-store').append(o); }
const brands = [...new Set(items.map(x=>x.brand))].sort();
for (const b of brands){ const o=document.createElement('option'); o.value=b; o.textContent=b; $('#f-brand').append(o); }

const maxSave = deals.reduce((m,x)=>Math.max(m,x.save),0);
$('#stats').innerHTML = `
  <div><strong>${DATA.n_prices}</strong>narx tekshirildi</div>
  <div><strong>${deals.length}</strong>chegirma</div>
  <div><strong>${mln(maxSave)}</strong>eng katta tejash</div>`;

function hotCard(x){
  const b=x.offers[0];
  return `<button class="hot" data-sku="${x.sku}" type="button">
    <span class="pct">−${Math.round(x.gap*100)}%</span>
    <span class="nm">${x.sku}</span>
    <span class="pr">${som(b.p)}</span>
    <span class="st">${b.s}</span></button>`;
}
$('#strip').innerHTML = deals.slice(0,8).map(hotCard).join('');

let shown = 10;
function filtered(){
  const q=$('#q').value.trim().toLowerCase(), br=$('#f-brand').value, pr=$('#f-price').value, st=$('#f-store').value;
  let base = (q||br||pr||st) ? items : deals;
  return base.filter(x=>{
    if (br && x.brand!==br) return false;
    if (st && x.offers[0].s!==st) return false;
    if (pr){ const [a,b]=pr.split('-').map(Number); const p=x.offers[0].p/1e6; if(p<a||p>=b) return false; }
    if (q && !x.sku.toLowerCase().includes(q)) return false;
    return true;
  });
}
function row(x){
  const b=x.offers[0];
  const others=x.offers.slice(1).map(o=>`${o.s} ${mln(o.p)}`).join(' · ') || 'faqat shu do\'konda';
  return `<button class="item" data-sku="${x.sku}" type="button">
    <span class="mono">${x.img?`<img src="${x.img}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${x.brand.slice(0,2).toUpperCase()}'))">`:x.brand.slice(0,2).toUpperCase()}</span>
    <span class="mid"><div class="nm">${x.sku}</div><div class="others">${others}</div></span>
    <span class="right"><div class="pr">${mln(b.p)}</div><div class="st">${b.s}</div>
      <span class="badge ${x.gap?'':'zero'}">${x.gap?'−'+Math.round(x.gap*100)+'%':'—'}</span></span></button>`;
}
function render(){
  const f=filtered(), active=$('#q').value||$('#f-brand').value||$('#f-price').value||$('#f-store').value;
  $('#top-sec').hidden = !!active;
  $('#list-title').textContent = active ? `Topildi: ${f.length} ta model` : 'Barcha chegirmalar';
  $('#list').innerHTML = f.length ? f.slice(0,shown).map(row).join('') : '<div class="empty">Bu filtrlar bo\'yicha model topilmadi. Filtrni o\'zgartiring yoki "Tozalash"ni bosing.</div>';
  $('#more').hidden = f.length<=shown;
  for (const id of ['f-brand','f-price','f-store']) $('#'+id).classList.toggle('on', !!$('#'+id).value);
}
['f-brand','f-price','f-store'].forEach(id=>$('#'+id).addEventListener('change',()=>{shown=10;render()}));
$('#q').addEventListener('input',()=>{shown=10;render()});
$('#reset').addEventListener('click',()=>{$('#q').value='';$('#f-brand').value='';$('#f-price').value='';$('#f-store').value='';shown=10;render()});
$('#more').addEventListener('click',()=>{shown+=10;render()});

function openSheet(sku){
  const x=items.find(i=>i.sku===sku); if(!x) return;
  const b=x.offers[0];
  const link=(o,txt)=>o.u?`<a href="${o.u}" target="_blank" rel="noopener">${txt}</a>`:txt;
  $('#sheet').innerHTML = `<div class="grab"></div>
    ${x.img?`<img class="hero" src="${x.img}" alt="" onerror="this.remove()">`:''}
    <div class="kicker">${x.deal?'Eng arzon narx':x.brand}</div>
    <h3>${x.sku}</h3>
    <div class="big"><span class="pr">${som(b.p)}</span><span class="st">${b.s}</span></div>
    ${x.save?`<div class="save">Keyingi do'kondan ${som(x.save)} arzon (−${Math.round(x.gap*100)}%)</div>`:''}
    <table>${x.offers.map((o,i)=>`<tr class="${i===0?'best':''}"><td>${o.s}${o.sel?`<span class="sel-n">${o.sel}</span>`:''}${o.o&&o.o>o.p?`<span class="old">${som(o.o)}</span>`:''}</td><td class="p">${link(o,som(o.p))}</td></tr>`).join('')}</table>
    <p class="note">Narx tarixi yig'ilmoqda. 14 kundan so'ng bu yerda narx grafigi va "haqiqiy chegirma" tekshiruvi paydo bo'ladi.</p>
    ${b.u?`<a class="cta" href="${b.u}" target="_blank" rel="noopener">${b.s} saytida ko'rish</a>`:''}
    <button class="cta ghost" type="button" id="watch">🔔 Narx tushsa xabar berish</button>`;
  $('#sheet').hidden=false; $('#sheet-bg').hidden=false;
  $('#watch').addEventListener('click',()=>toast('Kuzatuvga qo\'shildi — narx tushsa bot xabar beradi'));
}
function closeSheet(){ $('#sheet').hidden=true; $('#sheet-bg').hidden=true; }
$('#sheet-bg').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-sku]'); if(t) openSheet(t.dataset.sku);});
let tt; function toast(m){const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600);}
render();
</script>
</body></html>
